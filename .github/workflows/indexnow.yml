name: IndexNow ping

# Notifies Bing (and other IndexNow engines) when HTML pages change.
# Bing's index feeds ChatGPT search + DuckDuckGo, so fast Bing indexing
# is an AI-search lever, not just a Bing one. Does nothing for Google.

on:
  push:
    branches: [main]
    paths:
      - '**.html'

jobs:
  indexnow:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # GitHub Pages needs a moment to deploy before engines fetch the new content
      - name: Wait for Pages deploy
        run: sleep 90

      - name: Submit changed URLs to IndexNow
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE" 2>/dev/null; then
            echo "No usable before-SHA; nothing to submit."
            exit 0
          fi
          python3 scripts/indexnow.py --changed "$BEFORE..$AFTER" || echo "::warning::IndexNow submission failed"
